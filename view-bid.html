<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American Legacy Glass — Bid Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Web3Forms sends the acceptance notification email — no library needed, just a direct request -->
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #171717;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --accent: #ffffff;
    --green: #7ed4a0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .wrap { width: 100%; max-width: 600px; }
  .logo-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.05em; text-align: center; margin-bottom: 0.25rem; }
  .logo-sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.25rem; }
  .card-label { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
  .row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.9rem; }
  .row.total { border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.75rem; font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; }
  .piece-line { display: flex; justify-content: space-between; padding: 0.35rem 0; font-size: 0.85rem; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.04); }
  .piece-line span:first-child { color: var(--text); }
  .btn-approve {
    width: 100%; background: var(--green); border: none; border-radius: 10px; color: #0a1f14;
    cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.05em;
    padding: 1rem; transition: all 0.15s;
  }
  .btn-approve:hover { background: #8fe0b3; }
  .sign-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; }
  .sign-box label.lbl { display:block; font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.45rem; }
  .sign-box input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1.1rem; padding: 0.8rem 0.9rem; }
  .sign-box input[type=text]:focus { outline: none; border-color: var(--green); }
  .sign-agree { display: flex; gap: 0.65rem; align-items: flex-start; margin-top: 0.9rem; font-size: 0.88rem; line-height: 1.4; cursor: pointer; }
  .sign-agree input { width: 22px; height: 22px; flex: none; margin-top: 0.05rem; accent-color: var(--green); }

  .btn-approve:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .status-msg { text-align: center; padding: 2rem 1rem; }
  .status-msg .icon { font-size: 3rem; margin-bottom: 0.75rem; }
  .status-msg .title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem; }
  .status-msg .sub { color: var(--muted); font-size: 0.9rem; }
  .loading { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .wrap.wide { max-width: 880px; }
  .opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.9rem; margin-bottom: 1.25rem; }
  .opt-card { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 1.25rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.5rem; transition: border-color 0.15s, background 0.15s; text-align: left; font-family: inherit; color: inherit; }
  .opt-card:hover { border-color: #444; }
  .opt-card.selected { border-color: var(--green); background: rgba(126,212,160,0.07); }
  .opt-card .opt-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.04em; }
  .opt-card .opt-desc { color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
  .opt-card ul { list-style: none; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .opt-card ul li::before { content: '• '; color: var(--green); }
  .opt-card .opt-total { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; margin-top: auto; padding-top: 0.5rem; }
  .opt-card .opt-dep { color: var(--muted); font-size: 0.75rem; }
  .opt-card .opt-pick { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .opt-card.selected .opt-pick { color: var(--green); }
  .opt-intro { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
  .resp-links { text-align: center; margin-top: 0.9rem; font-size: 0.85rem; color: var(--muted); }
  .resp-links button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-family: inherit; font-size: inherit; padding: 0.3rem 0.4rem; }
  .resp-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; margin-top: 1rem; text-align: left; }
  .resp-panel h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: .04em; font-size: 1.25rem; margin-bottom: .6rem; }
  .resp-panel label.r { display: flex; gap: .55rem; align-items: center; padding: .35rem 0; font-size: .9rem; cursor: pointer; }
  .resp-panel label.r input { width: 20px; height: 20px; accent-color: var(--green); }
  .resp-panel textarea { width: 100%; min-height: 90px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1rem; padding: .7rem .8rem; margin-top: .5rem; resize: vertical; }
  .resp-panel .resp-btns { display: flex; gap: .6rem; margin-top: .8rem; }
  .resp-panel .resp-btns button { flex: 1; border-radius: 10px; padding: .75rem; font-family: 'DM Sans', sans-serif; font-size: .95rem; cursor: pointer; border: 1px solid var(--border); background: none; color: var(--text); }
  .resp-panel .resp-btns button.send { background: var(--text); color: #111; border-color: var(--text); font-weight: 600; }
  .note-box { border: 1px solid var(--border); border-radius: 12px; padding: .8rem 1rem; margin-bottom: 1rem; font-size: .88rem; line-height: 1.45; }
  .note-box.warn { border-color: #6b5a2e; background: rgba(232,194,122,.08); }
  .co-line { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: .92rem; }
  .fine-print { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 1rem; line-height: 1.5; }
  .page-footer { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
  .page-footer a { color: var(--text); text-decoration: none; }
  .page-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-title">AMERICAN LEGACY <span style="color:var(--green)">GLASS</span></div>
  <div class="logo-sub">Bid Approval</div>

  <div id="content">
    <div class="loading">Loading your bid…</div>
  </div>

  <div class="page-footer">
    Questions? Call <a href="tel:4804428121">480-442-8121</a> or email <a href="mailto:americanlegacyglass@gmail.com">americanlegacyglass@gmail.com</a>
  </div>
</div>

<script>
  // This page never talks to the database. It asks the Worker for a safe view of the bid (name, job,
  // totals — nothing about margins, costs, notes or contact details) and asks it to record the approval.
  const WORKER = 'https://morning-frost-ce94.rdenmyers1201.workers.dev';

  // ── Web3Forms sends the acceptance notification email — no library needed, just a direct request.
  // Sign up free at https://web3forms.com (just verify an email, no login needed). The key is public by design.
  const WEB3FORMS_ACCESS_KEY = 'cc74c432-5567-46e2-9c05-56b505e5b126';

  const params = new URLSearchParams(window.location.search);
  const bidId = params.get('id');
  const content = document.getElementById('content');

  // Customer name / job description / option names come from the database, so they're
  // escaped before going into innerHTML — plain text only, never markup.
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmt(n) {
    const safe = isNaN(n) ? 0 : n;
    return '$' + safe.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // A network call that never resolves (a stalled connection, a Worker that hangs) would otherwise
  // leave the customer stuck on "Approving…" forever. This forces any call to give up after a few seconds.
  async function fetchWithTimeout(url, options, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  function showError(msg) {
    content.innerHTML = `<div class="status-msg"><div class="icon">⚠️</div><div class="title">${escapeHtml(msg)}</div></div>`;
  }

  function showApproved(view, chosen) {
    const depositRequired = view.depositRequired !== false; // ON unless explicitly turned off
    const depositLines = depositRequired
      ? 'An invoice will follow shortly for the deposit. Production begins as soon as deposit is received. '
      : '';
    const chosenLine = chosen
      ? `<div class="sub" style="color:var(--text);margin-bottom:0.6rem;">You chose: <b>${escapeHtml(chosen.label)}</b> — ${fmt(chosen.total || 0)}</div>`
      : '';
    content.innerHTML = `
      <div class="status-msg">
        <div class="icon">✓</div>
        <div class="title" style="color:var(--green);">Bid Approved</div>
        ${chosenLine}
        ${view.signedName ? `<div class="sub" style="margin-bottom:0.6rem;">Signed by <b style="color:var(--text);">${escapeHtml(view.signedName)}</b>${view.signedAt ? ' on ' + escapeHtml(new Date(view.signedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })) : ''}</div>` : ''}
        <div class="sub">Thanks${view.customer ? ', ' + escapeHtml(view.customer) : ''}! ${depositLines}Once fabrication is complete our office will contact you to schedule installation.</div>
      </div>`;
  }

  // Typed signature: full name plus an "I approve" box. Both are checked again by the server.
  const SIGN_WORDING = 'I approve this bid and authorize American Legacy Glass to do the work described at the price shown.';
  function signBoxHtml() {
    return `<div class="sign-box">
      <label class="lbl" for="signName">Type your full name to sign</label>
      <input type="text" id="signName" autocomplete="name" maxlength="80" placeholder="Full name">
      <label class="sign-agree"><input type="checkbox" id="signAgree"><span>${SIGN_WORDING}</span></label>
    </div>`;
  }
  function signValues() {
    const n = (document.getElementById('signName') || {}).value || '';
    const name = n.replace(/\s+/g, ' ').trim();
    const agreed = !!(document.getElementById('signAgree') || {}).checked;
    return { name, agreed, ok: name.length >= 2 && /[A-Za-z\u00C0-\u024F]/.test(name) && agreed };
  }

  const CALL_US = 'Call us at <a href="tel:4804428121" style="color:var(--text);">480-442-8121</a>';
  const DECLINE_REASONS = ['Price too high', 'Timing does not work', 'Going with another company', 'No longer doing the project', 'Other'];
  function fmtDate(iso) { try { return new Date(iso.length === 10 ? iso + 'T12:00:00' : iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return iso; } }
  async function notifyShop(subject, message) {
    try {
      await fetchWithTimeout('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_key: WEB3FORMS_ACCESS_KEY, subject, email: 'americanlegacyglass@gmail.com', message }) });
    } catch (e) { console.error('Shop notification failed:', e); }
  }
  // "Request changes" / "Decline" for a whole bid. mode: 'changes' | 'declined'.
  function openRespond(view, mode, presetText) {
    const host = document.getElementById('respHost'); if (!host) return;
    host.innerHTML = mode === 'declined' ? `<div class="resp-panel">
        <h3>Decline this bid</h3>
        <div style="font-size:.85rem;color:var(--muted);margin-bottom:.4rem;">Mind telling us why? It helps us improve.</div>
        ${DECLINE_REASONS.map((r, i) => `<label class="r"><input type="radio" name="decReason" value="${escapeHtml(r)}"> ${escapeHtml(r)}</label>`).join('')}
        <textarea id="respText" maxlength="1000" placeholder="Anything else you'd like us to know (optional)"></textarea>
        <div class="resp-btns"><button type="button" id="respCancel">Cancel</button><button type="button" class="send" id="respSend">Decline bid</button></div>
      </div>` : `<div class="resp-panel">
        <h3>Request changes</h3>
        <div style="font-size:.85rem;color:var(--muted);">Tell us what you'd like changed and we'll send you an updated bid.</div>
        <textarea id="respText" maxlength="1000" placeholder="e.g. Can you price it without the transom?">${escapeHtml(presetText || '')}</textarea>
        <div class="resp-btns"><button type="button" id="respCancel">Cancel</button><button type="button" class="send" id="respSend">Send request</button></div>
      </div>`;
    document.getElementById('respCancel').onclick = () => { host.innerHTML = ''; };
    document.getElementById('respSend').onclick = () => sendRespond(view, mode);
    host.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  async function sendRespond(view, mode) {
    const text = (document.getElementById('respText').value || '').trim();
    const reasonEl = document.querySelector('input[name="decReason"]:checked');
    const reason = reasonEl ? reasonEl.value : '';
    if (mode === 'declined') {
      if (!reason) { alert('Please pick a reason.'); return; }
      if (reason === 'Other' && text.length < 3) { alert('Please tell us a little more.'); return; }
      if (!confirm('Decline this bid? You can still call us later if you change your mind.')) return;
    } else if (text.length < 3) { alert('Please tell us what you would like changed.'); return; }
    const btn = document.getElementById('respSend'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const res = await fetchWithTimeout(WORKER + '/respond-bid', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobId: bidId, type: mode, reason, comment: text }) }, 20000);
      let data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok || !data || !data.ok) { const e = new Error('failed'); e.userMessage = data && data.error; throw e; }
      if (!data.already) {
        await notifyShop((mode === 'declined' ? '✗ Bid DECLINED — ' : '✎ Changes requested — ') + (view.customer || 'Unknown') + ' (' + fmt(view.total || 0) + ')',
          (mode === 'declined' ? 'A customer declined a bid.\n\nReason: ' + reason + '\n' : 'A customer asked for changes to a bid.\n\n') +
          'Customer: ' + (view.customer || '') + '\nJob: ' + (view.jobDesc || '') + '\nBid ID: ' + bidId + '\n\n' + (mode === 'declined' ? 'Comment: ' : 'What they want changed: ') + (text || '(none)') +
          '\n\n' + (mode === 'declined' ? 'Worth a call while they are still deciding.' : 'Revise the bid, save it, and send the link again.'));
      }
      showResponded(data.view || view, mode);
    } catch (err) {
      btn.disabled = false; btn.textContent = mode === 'declined' ? 'Decline bid' : 'Send request';
      alert(err.userMessage || 'Something went wrong. Please try again or call us.');
    }
  }
  function showResponded(view, mode) {
    content.innerHTML = mode === 'declined'
      ? `<div class="status-msg"><div class="icon">✓</div><div class="title">Bid declined</div><div class="sub">Thanks for letting us know${view.customer ? ', ' + escapeHtml(view.customer) : ''}. If you change your mind, ${CALL_US}.</div></div>`
      : `<div class="status-msg"><div class="icon">✓</div><div class="title">Request sent</div><div class="sub">Thanks${view.customer ? ', ' + escapeHtml(view.customer) : ''}! We'll look at your changes and send you an updated bid. Questions? ${CALL_US}.</div></div>`;
  }
  function respLinksHtml() {
    return `<div class="resp-links"><button type="button" id="lnkChanges">Request changes</button> · <button type="button" id="lnkDecline">Decline this bid</button></div><div id="respHost"></div>`;
  }
  function wireRespLinks(view) {
    document.getElementById('lnkChanges').onclick = () => openRespond(view, 'changes');
    document.getElementById('lnkDecline').onclick = () => openRespond(view, 'declined');
  }
  // Notes shown above a bid: price expiry, an earlier "changes requested".
  function bidNotesHtml(view) {
    let h = '';
    if (view.response && view.response.type === 'changes') h += `<div class="note-box">You asked for changes${view.response.at ? ' on ' + escapeHtml(fmtDate(view.response.at)) : ''}. We'll send you an updated bid — or you can still approve this one below.</div>`;
    return h;
  }
  function validLineHtml(view) {
    return view.validUntil ? `<div class="row" style="color:var(--muted);font-size:0.8rem;">Price valid until ${escapeHtml(fmtDate(view.validUntil))}</div>` : '';
  }
  function showExpired(view) {
    content.innerHTML = `
      <div class="card"><div class="card-label">Prepared For</div><div style="font-size:1.1rem;font-weight:600;">${escapeHtml(view.customer || 'Customer')}</div>
        ${view.jobDesc ? `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.25rem;">${escapeHtml(view.jobDesc)}</div>` : ''}</div>
      <div class="note-box warn"><b>This price has expired.</b> It was valid until ${escapeHtml(fmtDate(view.validUntil))}. Material prices change, so we need to confirm it before you approve. ${CALL_US}, or ask for an updated price below.</div>
      <button class="btn-approve" id="btnUpdPrice">Request an updated price</button>
      <div id="respHost"></div>`;
    document.getElementById('btnUpdPrice').onclick = () => openRespond(view, 'changes', 'Please send me an updated price for this bid.');
  }
  function showDeclined(view) {
    content.innerHTML = `<div class="status-msg"><div class="icon">✕</div><div class="title">This bid was declined</div><div class="sub">${view.response && view.response.at ? 'Declined on ' + escapeHtml(fmtDate(view.response.at)) + '. ' : ''}Changed your mind? ${CALL_US}.</div></div>`;
  }

  // ── Change orders (link has &co=ID) ──
  const CO_WORDING = 'I approve this change order and authorize American Legacy Glass to do this added work at the price shown.';
  function showChangeOrder(view) {
    const co = view.co;
    const head = `<div class="card"><div class="card-label">Change order #${co.n}${co.title ? ' — ' + escapeHtml(co.title) : ''}</div>
        <div style="font-size:1.1rem;font-weight:600;">${escapeHtml(view.customer || 'Customer')}</div>
        ${view.jobDesc ? `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.25rem;">${escapeHtml(view.jobDesc)}</div>` : ''}</div>
      <div class="card"><div class="card-label">Added work</div>
        ${co.lines.map(l => `<div class="co-line"><span>${escapeHtml(l.desc)}</span><span>${fmt(l.amount)}</span></div>`).join('')}
        <div class="row total"><span>Change order total</span><span>${fmt(co.total)}</span></div>
        <div class="row" style="color:var(--muted);font-size:0.8rem;">This is added to your original bid.</div></div>`;
    if (co.status === 'approved') {
      content.innerHTML = head + `<div class="status-msg"><div class="icon">✓</div><div class="title" style="color:var(--green);">Change order approved</div>
        ${co.signedName ? `<div class="sub">Signed by <b style="color:var(--text);">${escapeHtml(co.signedName)}</b>${co.signedAt ? ' on ' + escapeHtml(new Date(co.signedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })) : ''}</div>` : ''}
        <div class="sub" style="margin-top:.5rem;">Thanks! We'll add this to your job.</div></div>`;
      return;
    }
    if (co.status === 'declined') { content.innerHTML = head + `<div class="status-msg"><div class="icon">✕</div><div class="title">Change order declined</div><div class="sub">We won't do this added work. Questions? ${CALL_US}.</div></div>`; return; }
    content.innerHTML = head + `
      <div class="sign-box">
        <label class="lbl" for="signName">Type your full name to sign</label>
        <input type="text" id="signName" autocomplete="name" maxlength="80" placeholder="Full name">
        <label class="sign-agree"><input type="checkbox" id="signAgree"><span>${CO_WORDING}</span></label>
      </div>
      <button class="btn-approve" id="approveBtn" disabled>Type your name and tick the box</button>
      <div class="fine-print">Your typed name, the date and time, and your internet address are saved with this approval as your signature.</div>
      <div class="resp-links"><button type="button" id="lnkCoDecline">Decline this change order</button></div><div id="respHost"></div>`;
    const btn = document.getElementById('approveBtn');
    const refresh = () => { const sv = signValues(); btn.disabled = !sv.ok; btn.textContent = sv.ok ? '✓ Approve change order — ' + fmt(co.total) : 'Type your name and tick the box'; };
    document.getElementById('signName').addEventListener('input', refresh);
    document.getElementById('signAgree').addEventListener('change', refresh);
    btn.onclick = () => { if (signValues().ok) respondCo(view, 'approve'); };
    document.getElementById('lnkCoDecline').onclick = () => {
      document.getElementById('respHost').innerHTML = `<div class="resp-panel"><h3>Decline this change order</h3>
        <textarea id="respText" maxlength="1000" placeholder="Anything you'd like us to know (optional)"></textarea>
        <div class="resp-btns"><button type="button" id="respCancel">Cancel</button><button type="button" class="send" id="respSend">Decline</button></div></div>`;
      document.getElementById('respCancel').onclick = () => { document.getElementById('respHost').innerHTML = ''; };
      document.getElementById('respSend').onclick = () => { if (confirm('Decline this change order?')) respondCo(view, 'decline'); };
    };
  }
  async function respondCo(view, action) {
    const co = view.co;
    const btn = document.getElementById(action === 'approve' ? 'approveBtn' : 'respSend');
    btn.disabled = true; btn.textContent = action === 'approve' ? 'Approving…' : 'Sending…';
    const sv = signValues(), comment = ((document.getElementById('respText') || {}).value || '').trim();
    try {
      const res = await fetchWithTimeout(WORKER + '/respond-change-order', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobId: bidId, coId: co.id, action, signerName: sv.name, agreed: sv.agreed, comment }) }, 20000);
      let data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok || !data || !data.ok) { const e = new Error('failed'); e.userMessage = data && data.error; throw e; }
      if (!data.already) {
        await notifyShop((action === 'approve' ? '✓ Change order APPROVED — ' : '✗ Change order declined — ') + (view.customer || '') + ' (#' + co.n + ', ' + fmt(co.total) + ')',
          'Customer: ' + (view.customer || '') + '\nJob: ' + (view.jobDesc || '') + '\nBid ID: ' + bidId + '\nChange order #' + co.n + (co.title ? ' — ' + co.title : '') + '\nTotal: ' + fmt(co.total) + '\n' +
          (action === 'approve' ? 'Signed by: ' + sv.name : 'Comment: ' + (comment || '(none)')));
        if (action === 'approve') {
          try { await fetchWithTimeout(WORKER + '/invoice-change-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jobId: bidId, coId: co.id }) }, 20000); }
          catch (e) { console.error('Change order invoice failed:', e); }
        }
      }
      showChangeOrder(data.view);
    } catch (err) {
      btn.disabled = false; btn.textContent = action === 'approve' ? '✓ Approve change order — ' + fmt(co.total) : 'Decline';
      alert(err.userMessage || 'Something went wrong. Please try again or call us.');
    }
  }

  function chosenOf(view) {
    return view.options ? (view.options.find(o => o.id === view.selectedOptionId) || null) : null;
  }

  async function loadBid() {
    if (!bidId) { showError('No bid specified'); return; }
    try {
      const coParam = params.get('co');
      const res = await fetchWithTimeout(WORKER + '/bid-view?id=' + encodeURIComponent(bidId) + (coParam ? '&co=' + encodeURIComponent(coParam) : ''), { cache: 'no-store' }, 15000);
      if (res.status === 404) { showError('Bid not found'); return; }
      let view = null;
      try { view = await res.json(); } catch (e) { /* handled below */ }
      if (!res.ok || !view || !view.ok) { showError('Could not load this bid right now. Please try again in a moment, or call us.'); return; }

      if (view.kind === 'changeOrder') { showChangeOrder(view); return; }
      if (view.status === 'accepted') { showApproved(view, chosenOf(view)); return; }
      if (view.response && view.response.type === 'declined') { showDeclined(view); return; }
      if (view.expired) { showExpired(view); return; }
      if (view.options) { renderOptionChoice(view, view.options); return; }

      content.innerHTML = bidNotesHtml(view) + `
        <div class="card">
          <div class="card-label">Prepared For</div>
          <div style="font-size:1.1rem;font-weight:600;">${escapeHtml(view.customer || 'Customer')}</div>
          ${view.jobDesc ? `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.25rem;">${escapeHtml(view.jobDesc)}</div>` : ''}
        </div>
        <div class="card">
          <div class="row total">
            <span style="display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;">
              <span>Total</span>
              <span style="font-family:'DM Sans',sans-serif;text-transform:none;letter-spacing:normal;font-size:0.55rem;color:var(--muted);">(includes all materials and installation)</span>
            </span>
            <span>${fmt(view.total || 0)}</span>
          </div>
          ${view.depositRequired !== false ? `<div class="row" style="color:var(--muted);font-size:0.8rem;">50% deposit required to begin production</div>` : ''}
          ${validLineHtml(view)}
        </div>
        ${signBoxHtml()}
        <button class="btn-approve" id="approveBtn" disabled>Type your name and tick the box</button>
        <div class="fine-print">Your typed name, the date and time, and your internet address are saved with this approval as your signature.</div>
        ${respLinksHtml()}
      `;
      wireRespLinks(view);
      const btn1 = document.getElementById('approveBtn');
      const refresh1 = () => { const sv = signValues(); btn1.disabled = !sv.ok; btn1.textContent = sv.ok ? '✓ Approve Bid Now' : 'Type your name and tick the box'; };
      document.getElementById('signName').addEventListener('input', refresh1);
      document.getElementById('signAgree').addEventListener('change', refresh1);
      btn1.addEventListener('click', () => { if (signValues().ok) approveBid(view, null); });
    } catch (err) {
      console.error('Bid load error:', err);
      showError('Could not load this bid — please check your connection and try again, or call us.');
    }
  }

  function renderOptionChoice(view, opts) {
    document.querySelector('.wrap').classList.add('wide');
    const depositOn = view.depositRequired !== false;
    content.innerHTML = bidNotesHtml(view) + `
      <div class="card">
        <div class="card-label">Prepared For</div>
        <div style="font-size:1.1rem;font-weight:600;">${escapeHtml(view.customer || 'Customer')}</div>
        ${view.jobDesc ? `<div style="color:var(--muted);font-size:0.85rem;margin-top:0.25rem;">${escapeHtml(view.jobDesc)}</div>` : ''}
        ${view.validUntil ? `<div style="color:var(--muted);font-size:0.8rem;margin-top:0.4rem;">Prices valid until ${escapeHtml(fmtDate(view.validUntil))}</div>` : ''}
      </div>
      <div class="opt-intro">We've prepared ${opts.length} options for you. Tap the one you'd like, then approve it below.</div>
      <div class="opt-grid">
        ${opts.map(o => {
          const items = (o.items || []).filter(Boolean);
          const shown = items.slice(0, 8);
          return `<button type="button" class="opt-card" data-id="${escapeHtml(o.id)}">
            <div class="opt-name">${escapeHtml(o.label)}</div>
            ${o.description ? `<div class="opt-desc">${escapeHtml(o.description)}</div>` : ''}
            ${shown.length ? `<ul>${shown.map(d => `<li>${escapeHtml(d)}</li>`).join('')}${items.length > shown.length ? `<li>…and ${items.length - shown.length} more</li>` : ''}</ul>` : ''}
            <div class="opt-total">${fmt(o.total || 0)}</div>
            <div class="opt-dep">(includes all materials and installation)${depositOn ? ' · 50% deposit: ' + fmt((o.total || 0) * 0.5) : ''}</div>
            <div class="opt-pick">Tap to choose</div>
          </button>`;
        }).join('')}
      </div>
      ${signBoxHtml()}
      <button class="btn-approve" id="approveBtn" disabled>Choose an option above</button>
      <div class="fine-print">Your typed name, the date and time, and your internet address are saved with this approval as your signature.</div>
      ${respLinksHtml()}
    `;
    wireRespLinks(view);
    let chosen = null;
    const btn = document.getElementById('approveBtn');
    const refresh = () => {
      const sv = signValues();
      btn.disabled = !(chosen && sv.ok);
      btn.textContent = !chosen ? 'Choose an option above' : !sv.ok ? 'Type your name and tick the box' : '✓ Approve ' + chosen.label + ' — ' + fmt(chosen.total || 0);
    };
    document.getElementById('signName').addEventListener('input', refresh);
    document.getElementById('signAgree').addEventListener('change', refresh);
    content.querySelectorAll('.opt-card').forEach(card => {
      card.addEventListener('click', () => {
        chosen = opts.find(o => o.id === card.dataset.id) || null;
        content.querySelectorAll('.opt-card').forEach(c => {
          const on = c === card;
          c.classList.toggle('selected', on);
          c.querySelector('.opt-pick').textContent = on ? '✓ Selected' : 'Tap to choose';
        });
        refresh();
      });
    });
    btn.addEventListener('click', () => {
      if (!chosen || !signValues().ok) return;
      // Approval is permanent and creates an invoice, so confirm the exact option and price first.
      if (!confirm('Approve "' + chosen.label + '" for ' + fmt(chosen.total || 0) + '?')) return;
      approveBid(view, chosen);
    });
  }

  async function approveBid(view, chosenOption) {
    const btn = document.getElementById('approveBtn');
    btn.disabled = true;
    btn.textContent = 'Approving…';
    try {
      // The Worker records the approval atomically: if the same bid is approved from two devices at once,
      // exactly one succeeds and the other is told it was already approved (and which option won).
      const res = await fetchWithTimeout(WORKER + '/approve-bid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobId: bidId, optionId: chosenOption ? chosenOption.id : undefined, signerName: signValues().name, agreed: signValues().agreed }),
      }, 20000);
      let data = null;
      try { data = await res.json(); } catch (e) { /* handled below */ }
      if (!res.ok || !data || !data.ok) {
        const e = new Error((data && data.error) || 'approval failed');
        e.userMessage = data && data.error;
        throw e;
      }
      const fresh = data.view;

      // Notify the shop by email via Web3Forms — only for the request that actually made the approval,
      // so a double-tap or a second device never sends a duplicate.
      if (!data.alreadyApproved) {
        try {
          const total = chosenOption ? chosenOption.total : (fresh.total || 0);
          const emailRes = await fetchWithTimeout('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              access_key: WEB3FORMS_ACCESS_KEY,
              subject: '✓ Bid Approved — ' + (fresh.customer || 'Unknown') + ' (' + fmt(total) + ')' + (chosenOption ? ' — ' + chosenOption.label : ''),
              email: 'americanlegacyglass@gmail.com', // "from" shown in the notification, not the recipient
              message: 'A customer just approved a bid through the online link.\n\n' +
                'Customer: ' + (fresh.customer || 'Unknown') + '\n' +
                'Job: ' + (fresh.jobDesc || '') + '\n' +
                (chosenOption ? 'Option chosen: ' + chosenOption.label + '\n' : '') +
                'Signed by: ' + (fresh.signedName || signValues().name) + '\n' +
                'Total: ' + fmt(total) + '\n' +
                'Bid ID: ' + bidId + '\n\n' +
                'Reach out to schedule the work.',
            }),
          });
          const emailResult = await emailRes.json();
          if (!emailResult.success) console.error('Web3Forms reported failure:', emailResult.message);
        } catch (emailErr) {
          // The approval itself already succeeded — this only means the notification email failed.
          console.error('Email notification FAILED:', emailErr);
        }
      }

      // Create the Xero invoice. Safe to ask for every time: the Worker never makes a second invoice for the
      // same job, so if a lost connection hid the first attempt's result, this second try finishes the job.
      // Wrapped separately — the customer's approval already succeeded; a bookkeeping hiccup is ALG's to handle
      // (the Worker alerts ALG itself), not something to show them.
      try {
        await fetchWithTimeout(WORKER + '/create-xero-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId: bidId }),
        });
      } catch (invErr) {
        console.error('Xero invoice creation FAILED:', invErr);
      }

      showApproved(fresh, chosenOf(fresh) || chosenOption || null);
    } catch (err) {
      console.error(err);
      btn.disabled = !signValues().ok;
      btn.textContent = chosenOption ? ('✓ Approve ' + chosenOption.label + ' — ' + fmt(chosenOption.total || 0)) : '✓ Approve Bid Now';
      alert(err.userMessage || 'Something went wrong approving this bid. Please try again or call us directly.');
    }
  }

  loadBid();
</script>
</body>
</html>
